# MCP Conversation Engine — Single Instance Deployment
#
# docker compose up -d

x-backend-common: &backend-common
  build: ./backend
  restart: unless-stopped
  environment:
    - MAX_TOOL_ROUNDS=100

services:
  mongodb:
    image: mongo:8.2.7-noble
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.2-alpine3.22
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    <<: *backend-common
    ports:
      - "3000:3000"
      - "9990-9999:9990-9999"
    volumes:
      - ./config.json:/config.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "http://localhost:3000"
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
