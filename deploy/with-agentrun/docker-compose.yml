
services:
  mongodb:
    image: mongo:8.3.1-noble
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  agentrun-mcp:
    build:
      context: ./agentrun-mcp-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - AGENTRUN_CONFIG=/config.json
      - NODE_ENV=production
    volumes:
      - ./agentrun-mcp-sidecar/config.json:/config.json:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      - MAX_TOOL_ROUNDS=100
    ports:
      - "3000:3000"
      - "9990-9999:9990-9999"
    volumes:
      - ./config.json:/config.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      agentrun-mcp:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE: "http://localhost:3000"
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
